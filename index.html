<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>My Telemetry App</title>
    <!-- Corrected Stlite CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.73.1/build/stlite.css"
    />
  </head>
  <body>
    <div id="root"></div>
    <!-- Corrected Stlite JavaScript Engine -->
    <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.73.1/build/stlite.js"></script>
    <script>
      stlite.mount(
        {
          requirements: ["pandas", "numpy", "plotly"], 
          entrypoint: "joke.py", // Make sure this matches your exact .py filename
          files: {
            "joke.py": {
              url: "./joke.py", // Must match the filename in your repo root
            },
          },
        },
        document.getElementById("root")
      );
    </script>
  </body>
</html>
