<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>My Telemetry App</title>
    <script>
      const base = "https://" + "cdn.jsdelivr.net/npm/@stlite/browser@0.83.0/build/";
      document.write('<link rel="stylesheet" href="' + base + 'stlite.css" />');
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      const base = "https://" + "cdn.jsdelivr.net/npm/@stlite/browser@0.83.0/build/";
      const { mount } = await import(base + "stlite.js");
      mount(
        {
          requirements: ["pandas", "numpy", "plotly"],
          entrypoint: "joke.py",
          files: {
            "joke.py": {
              url: "./joke.py",
            },
          },
        },
        document.getElementById("root")
      );
    </script>
  </body>
</html>
